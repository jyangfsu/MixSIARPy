name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face client
        run: python -m pip install --upgrade huggingface_hub

      - name: Upload Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("GitHub repository secret HF_TOKEN is missing")

          api = HfApi(token=token)
          user = api.whoami()
          print(f"Authenticated to Hugging Face as: {user['name']}")
          result = api.upload_folder(
              repo_id="jyang-research/MixSIARPy",
              repo_type="space",
              folder_path=".",
              commit_message="Deploy from GitHub Actions",
              ignore_patterns=[
                  ".git/**", ".github/**", ".pytest_cache/**",
                  "**/__pycache__/**", "build/**", "dist/**",
                  "outputs/**", "validation/numerical_agreement*/**",
                  "manuscript/**", "manuscript_results/**",
                  "**/*.nc", "**/*.rds", "**/*.log",
              ],
          )
          print(result)
          PY
